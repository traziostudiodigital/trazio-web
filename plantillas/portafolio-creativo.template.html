<!-- Script de Control Interactivo -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const paneCreativo = document.getElementById('pane-creativo');
    const paneCorporativo = document.getElementById('pane-corporativo');
    const viewport = document.getElementById('portfolio-viewport');

    const btnCreativoDesktop = document.getElementById('btn-profile-creativo');
    const btnCorporativoDesktop = document.getElementById('btn-profile-corporativo');
    const btnCreativoMobile = document.getElementById('btn-profile-creativo-mobile');
    const btnCorporativoMobile = document.getElementById('btn-profile-corporativo-mobile');

    const activeBtnClasses = 'bg-custom-accent text-black font-bold shadow-sm rounded-lg';
    const inactiveBtnClasses = 'bg-transparent text-custom-muted hover:text-custom-main font-semibold rounded-lg';

    function applyClasses(element, classesToAdd, classesToRemove) {
        if (!element) return;
        classesToRemove.split(' ').forEach(cls => element.classList.remove(cls));
        classesToAdd.split(' ').forEach(cls => element.classList.add(cls));
    }

    function setProfile(profile) {
        if (!viewport) return;
        viewport.classList.add('opacity-0', 'translate-y-4');
        viewport.classList.remove('opacity-100', 'translate-y-0');

        setTimeout(() => {
            if (profile === 'creativo') {
                if (paneCreativo) { paneCreativo.classList.remove('hidden'); paneCreativo.classList.add('block'); }
                if (paneCorporativo) { paneCorporativo.classList.remove('block'); paneCorporativo.classList.add('hidden'); }

                applyClasses(btnCreativoDesktop, activeBtnClasses, inactiveBtnClasses);
                applyClasses(btnCorporativoDesktop, inactiveBtnClasses, activeBtnClasses);
                applyClasses(btnCreativoMobile, activeBtnClasses, inactiveBtnClasses);
                applyClasses(btnCorporativoMobile, inactiveBtnClasses, activeBtnClasses);

            } else if (profile === 'corporativo') {
                if (paneCreativo) { paneCreativo.classList.remove('block'); paneCreativo.classList.add('hidden'); }
                if (paneCorporativo) { paneCorporativo.classList.remove('hidden'); paneCorporativo.classList.add('block'); }

                applyClasses(btnCreativoDesktop, inactiveBtnClasses, activeBtnClasses);
                applyClasses(btnCorporativoDesktop, activeBtnClasses, inactiveBtnClasses);
                applyClasses(btnCreativoMobile, inactiveBtnClasses, activeBtnClasses);
                applyClasses(btnCorporativoMobile, activeBtnClasses, inactiveBtnClasses);
            }

            viewport.classList.remove('opacity-0', 'translate-y-4');
            viewport.classList.add('opacity-100', 'translate-y-0');
        }, 150);
    }

    // Initial state
    setProfile('creativo');

    if (btnCreativoDesktop) btnCreativoDesktop.addEventListener('click', () => setProfile('creativo'));
    if (btnCorporativoDesktop) btnCorporativoDesktop.addEventListener('click', () => setProfile('corporativo'));
    if (btnCreativoMobile) btnCreativoMobile.addEventListener('click', () => setProfile('creativo'));
    if (btnCorporativoMobile) btnCorporativoMobile.addEventListener('click', () => setProfile('corporativo'));

    // Interactividad del Calendario
    document.querySelectorAll('[id*="calendar-grid"] span, #tech-calendar-grid span').forEach(day => {
        day.addEventListener('click', () => {
            if (day.classList.contains('text-custom-muted/30') || day.classList.contains('text-custom-muted/50')) return;
            const grid = day.closest('[id*="calendar-grid"]') || day.closest('#tech-calendar-grid');
            if (!grid) return;

            grid.querySelectorAll('.absolute.w-7.h-7.rounded-full').forEach(el => el.remove());
            grid.querySelectorAll('span').forEach(s => s.classList.remove('text-black', 'font-bold', 'relative', 'z-10'));

            const circle = document.createElement('div');
            circle.className = 'absolute w-7 h-7 rounded-full bg-[#C9A96E]';
            circle.style.top = '50%'; circle.style.left = '50%'; circle.style.transform = 'translate(-50%, -50%)';
            
            day.classList.add('text-black', 'font-bold', 'relative', 'z-10');
            day.appendChild(circle);
        });
    });
});
</script>
