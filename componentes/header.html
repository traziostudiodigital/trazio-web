    <!-- Script de control del Header -->
    <script>
    (function () {
        var btn = document.getElementById('mobile-menu-btn');
        var panel = document.getElementById('mobile-menu');
        var backdrop = document.getElementById('mobile-menu-backdrop');
        var hamburger = document.getElementById('hamburger-icon');
        var close = document.getElementById('close-icon');

        function openMenu() {
            if(!panel) return;
            panel.classList.remove('opacity-0', 'invisible', '-translate-y-2');
            if(backdrop) backdrop.classList.remove('hidden');
            if(hamburger) hamburger.classList.add('hidden');
            if(close) close.classList.remove('hidden');
            btn.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        }
        function closeMenu() {
            if(!panel) return;
            panel.classList.add('opacity-0', 'invisible', '-translate-y-2');
            if(backdrop) backdrop.classList.add('hidden');
            if(hamburger) hamburger.classList.remove('hidden');
            if(close) close.classList.add('hidden');
            btn.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }
        if(btn) {
            btn.addEventListener('click', function () {
                btn.getAttribute('aria-expanded') === 'true' ? closeMenu() : openMenu();
            });
        }
        if(backdrop) backdrop.addEventListener('click', closeMenu);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
        if(panel) panel.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });

        // Dropdown "Portafolios" (desktop, clic)
        var wrapper = document.querySelector('[data-dropdown]');
        if(wrapper) {
            var trigger = wrapper.querySelector('.dropdown-trigger');
            var ddPanel = wrapper.querySelector('.dropdown-panel');
            var chevron = wrapper.querySelector('.dropdown-chevron');

            function openDD() {
                ddPanel.classList.remove('opacity-0', 'invisible', '-translate-y-2');
                trigger.setAttribute('aria-expanded', 'true');
                chevron.classList.add('rotate-180');
            }
            function closeDD() {
                ddPanel.classList.add('opacity-0', 'invisible', '-translate-y-2');
                trigger.setAttribute('aria-expanded', 'false');
                chevron.classList.remove('rotate-180');
            }
            trigger.addEventListener('click', function (e) {
                e.stopPropagation();
                trigger.getAttribute('aria-expanded') === 'true' ? closeDD() : openDD();
            });
            document.addEventListener('click', function (e) {
                if (!wrapper.contains(e.target)) closeDD();
            });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDD(); });
        }

        // Detección automática de página activa
        var path = window.location.pathname.split('/').pop() || 'index.html';
        var dropdownHasActive = false;
        document.querySelectorAll('[data-nav-link]').forEach(function (link) {
            var href = link.getAttribute('href');
            if (href === path) {
                link.setAttribute('aria-current', 'page');
                link.classList.add('text-custom-accent');
                if (wrapper && wrapper.contains(link)) dropdownHasActive = true;
            }
        });
        if (dropdownHasActive && wrapper) {
            var trigger = wrapper.querySelector('.dropdown-trigger');
            if(trigger) trigger.classList.add('text-custom-accent');
        }
    })();
    </script>
