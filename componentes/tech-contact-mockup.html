<!-- componentes/tech-contact-mockup.html -->
<section class="max-w-5xl mx-auto px-6 mb-24">
    <div class="bg-custom-card border border-custom/20 rounded-2xl p-8 md:p-12 flex flex-col md:flex-row gap-12 items-center shadow-2xl relative overflow-hidden">
        
        <!-- Badge Superior Izquierdo -->
        <div class="absolute top-0 left-0 bg-custom-accent text-black text-[10px] font-black uppercase px-3 py-1.5 rounded-br-lg z-10 shadow-md">
            Simulador de Contacto
        </div>
        
        <!-- Textos -->
        <div class="flex-1 mt-4 md:mt-0">
            <h3 class="text-3xl font-bold mb-4 text-custom-main">Filtra a los curiosos.</h3>
            <p class="text-custom-muted text-sm md:text-base leading-relaxed mb-6">
                No recibas mensajes vacíos por WhatsApp. Integramos un formulario profesional (conectado a tu correo o WhatsApp) que obliga al cliente a especificar su presupuesto y el alcance del proyecto antes de contactarte.
            </p>
            <a href="https://wa.me/5350000000?text=Hola,%20quiero%20cotizar%20mi%20Dossier%20Interactivo" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-custom-accent font-semibold hover:text-custom-main transition-colors text-sm">
                Quiero este formulario en mi web <span class="ml-2">→</span>
            </a>
        </div>
        
        <!-- Mockup Visual del Formulario (Activo) -->
        <div class="flex-1 w-full bg-custom-main/50 p-6 rounded-xl border border-custom/10 relative">
            <!-- Formulario funcional -->
            <form id="tech-contact-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-custom-muted mb-1.5">Empresa / Proyecto</label>
                    <input type="text" id="empresa" required class="w-full h-10 bg-custom-card border border-custom/20 rounded-md px-3 text-sm focus:outline-none focus:ring-2 focus:ring-custom-accent" placeholder="Nombre de la empresa o proyecto">
                </div>
                <div>
                    <label class="block text-xs font-bold text-custom-muted mb-1.5">Presupuesto Estimado</label>
                    <input type="text" id="presupuesto" required class="w-full h-10 bg-custom-card border border-custom/20 rounded-md px-3 text-sm focus:outline-none focus:ring-2 focus:ring-custom-accent" placeholder="Ej: +$1,000 USD">
                </div>
                <div>
                    <label class="block text-xs font-bold text-custom-muted mb-1.5">Descripción del Reto Técnico</label>
                    <textarea id="descripcion" required rows="4" class="w-full h-20 bg-custom-card border border-custom/20 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-custom-accent" placeholder="Describe brevemente el desafío técnico"></textarea>
                </div>
                <button type="submit" id="btn-enviar" class="w-full py-3 bg-custom-accent text-black font-bold uppercase text-xs tracking-wider rounded-md hover:bg-custom-accent/90 transition-colors">
                    Enviar Propuesta
                </button>
            </form>
        </div>
        
    </div>
</section>
<!-- Script separado para la lógica del formulario -->
<script src="tech-contact-form.js" defer></script>
